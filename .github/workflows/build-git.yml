name: Build Git

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Runner self-hosté sur la même machine que les builds locaux (comme
  # DevConsole) : la compilation passe par le verrou anti double-build
  # scripts/build-lock.sh. BUILD_LOCK_WAIT=1 → la CI attend au lieu d'échouer.
  BUILD_LOCK_WAIT: "1"

on:
  workflow_dispatch:
    inputs:
      git_version:
        description: 'Git version (semver, e.g. 2.54.0)'
        required: true
        type: string
        default: '2.54.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Build Git statically (musl)
        run: scripts/build-lock.sh scripts/build-git.sh ${{ inputs.git_version }}

      - name: Check archive contents
        run: |
          tar tzf git-*.tar.gz

      # Un rebuild de la même version recrée le tag (suppression préalable).
      - name: Delete existing release (rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "git-${{ inputs.git_version }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: git-${{ inputs.git_version }}
          name: Git ${{ inputs.git_version }} (static)
          body: |
            Static Git ${{ inputs.git_version }} build for DevConsole.

            Full build with submodule support — unlike `darkvertex/static-git`.

            ## Build config
            - Cross-compilation musl (musl.cc), sans Docker
            - zlib, openssl, curl compilés en statique depuis leurs sources
            - NO_GETTEXT=1, NO_TCLTK=1, NO_PERL=1, NO_PYTHON=1
            - Includes `libexec/git-core/` with `git-submodule`
          files: git-*.tar.gz
          make_latest: false
