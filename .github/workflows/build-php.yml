name: Build PHP

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # La CI tourne sur un runner self-hosté sur la même machine que les builds
  # locaux (comme DevConsole) : la compilation PHP passe par le verrou
  # anti double-build scripts/build-lock.sh. BUILD_LOCK_WAIT=1 → la CI attend
  # la fin d'un build local au lieu d'échouer.
  BUILD_LOCK_WAIT: "1"

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP minor version (e.g., 8.4)'
        required: true
        type: string
        default: '8.4'
      spc_version:
        description: 'static-php-cli version (e.g., 2.8.5)'
        required: false
        type: string
        default: '2.8.5'

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    # Runner self-hosté sur un dépôt public : ne jamais exécuter hors du repo
    # d'origine (un fork ne peut pas dispatcher, mais garde-fou par défaut).
    if: github.repository == 'Paul75/devconsole-registry'

    steps:
      - uses: actions/checkout@v6

      # Sur runner GitHub-hosted uniquement : les dépendances de compilation.
      # En self-hosted, l'outillage est pré-installé sur la machine
      # (gcc, make, cmake, autoconf, bison, re2c, libxml2-dev, … + flex/gperf).
      - name: Install build dependencies
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool cmake make gcc g++ \
            pkg-config re2c bison libxml2-dev libsqlite3-dev libcurl4-openssl-dev \
            libreadline-dev libzip-dev libonig-dev libssl-dev flex gperf

      - name: Download spc
        run: |
          curl -fsSL -o spc.tar.gz "https://github.com/crazywhalecc/static-php-cli/releases/download/${{ inputs.spc_version }}/spc-linux-x86_64.tar.gz"
          tar -xzf spc.tar.gz
          chmod +x spc

      - name: Generate craft config
        run: |
          cat > craft.yml << 'CRAFT'
          php-version: "${{ inputs.php_version }}"
          extensions: "bcmath,ctype,curl,dom,exif,fileinfo,filter,gd,iconv,mbstring,mongodb,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,pgsql,phar,posix,readline,session,simplexml,sockets,sodium,sqlite3,tokenizer,xml,xmlwriter,xmlreader,xsl,zip,zlib"
          sapi: [cli, fpm, cgi]
          craft-options:
            clean: true
          CRAFT

      - name: Build PHP
        run: scripts/build-lock.sh ./spc craft craft.yml

      - name: Get full PHP version
        id: version
        run: |
          FULL_VERSION=$(./buildroot/bin/php -r 'echo PHP_VERSION;')
          echo "full=$FULL_VERSION" >> "$GITHUB_OUTPUT"

      # Un rebuild de la même version recrée le tag (suppression préalable).
      - name: Delete existing release (rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "php-${{ steps.version.outputs.full }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Create archive
        run: |
          FULL_VERSION="${{ steps.version.outputs.full }}"
          # static-php-cli puts php-fpm in bin/, but DevConsole expects sbin/php-fpm
          mkdir -p buildroot/sbin
          cp buildroot/bin/php-fpm buildroot/sbin/php-fpm
          tar czf "php-${FULL_VERSION}-fpm-linux-x86_64.tar.gz" \
            -C buildroot bin/php bin/php-cgi sbin/php-fpm

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: php-${{ steps.version.outputs.full }}
          name: PHP ${{ steps.version.outputs.full }} (static FPM)
          body: |
            Static PHP ${{ steps.version.outputs.full }} build with FPM support for DevConsole.

            ## Extensions
            bcmath, ctype, curl, dom, exif, fileinfo, filter, gd, iconv,
            mbstring, mongodb, mysqli, mysqlnd, opcache, openssl, pcntl,
            pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, pgsql, phar, posix,
            readline, session, simplexml, sockets, sodium, sqlite3,
            tokenizer, xml, xmlwriter, xmlreader, xsl, zip, zlib

            ## SAPIs
            - `bin/php` (CLI)
            - `sbin/php-fpm` (FPM)
            - `bin/php-cgi` (CGI)

            ## Build config
            See [`craft.yml`](https://github.com/Paul75/devconsole-registry/blob/main/craft.yml)
          files: php-*.tar.gz
          make_latest: false
