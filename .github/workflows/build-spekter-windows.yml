name: Build Spekter Windows

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      spekter_version:
        description: 'Spekter version (semver, e.g. 1.3.1) — tag vX.Y.Z sur gitlab.com/hallyhaa/spekter'
        required: true
        type: string
        default: '1.3.1'

permissions:
  contents: write

jobs:
  build:
    # Runner GitHub hébergé (public repo → gratuit). Le build Linux continue
    # sur le runner self-hosted (build-spekter.yml) : les deux publient leur
    # archive sur le même tag `spekter-<version>`.
    runs-on: windows-latest
    if: github.repository == 'Paul75/devconsole-registry'
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Spekter Windows (egui, rust stable)
        shell: bash
        run: scripts/build-spekter-windows.sh ${{ inputs.spekter_version }}

      - name: Check archive contents & sha256
        shell: bash
        run: |
          tar tzf spekter-*.tar.gz
          sha256sum spekter-*.tar.gz

      # Upload sur la release existante SANS la supprimer : le build Linux
      # (self-hosted) publie déjà son archive sur ce même tag.
      - name: Publish asset on release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="spekter-${{ inputs.spekter_version }}"
          archive="spekter-${{ inputs.spekter_version }}-windows_x86_64.tar.gz"
          echo "→ SHA256 :"
          sha256sum "$archive"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Spekter ${{ inputs.spekter_version }} (Windows x86_64)" \
              --notes "Spekter ${{ inputs.spekter_version }} — binaire Windows buildé sur runner windows-latest depuis le tag GitLab hallyhaa/spekter (MIT).

## Binaries
- \`spekter.exe\` — GUI
- \`spekter-nw.exe\` — mode terminal"
          fi
          echo "✅ Asset publié : https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"