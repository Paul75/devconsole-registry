name: Build Spekter

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Runner self-hosté sur la même machine que les builds locaux (comme
  # DevConsole) : la compilation passe par le verrou anti double-build
  # scripts/build-lock.sh. BUILD_LOCK_WAIT=1 → la CI attend au lieu d'échouer.
  BUILD_LOCK_WAIT: "1"

on:
  workflow_dispatch:
    inputs:
      spekter_version:
        description: 'Spekter version (semver, e.g. 1.3.1) — tag vX.Y.Z sur gitlab.com/hallyhaa/spekter'
        required: true
        type: string
        default: '1.3.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    # Runner self-hosté sur un dépôt public : ne jamais exécuter hors du repo
    # d'origine (un fork ne peut pas dispatcher, mais garde-fou par défaut).
    if: github.repository == 'Paul75/devconsole-registry'
    steps:
      - uses: actions/checkout@v6

      - name: Build Spekter (egui, toolchain DevConsole)
        run: scripts/build-lock.sh scripts/build-spekter.sh ${{ inputs.spekter_version }}

      - name: Check archive contents & sha256
        run: |
          tar tzf spekter-*.tar.gz
          sha256sum spekter-*.tar.gz

      # Un rebuild de la même version remplace l'asset Linux (jamais de
      # `gh release delete` : la release entière est partagée avec l'asset
      # Windows de build-spekter-windows.yml).
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="spekter-${{ inputs.spekter_version }}"
          # Rebuild : on ne supprime PAS la release entière — l'asset Windows
          # partage ce tag (build-spekter-windows.yml).
          notes="Spekter ${{ inputs.spekter_version }} — diff visuel fichiers/dossiers (Meld-like), binaire egui/eframe autonome, build depuis le tag GitLab hallyhaa/spekter (MIT).

            ## Binaries
            - \`spekter\` — GUI (comparaison side-by-side/unified, syntax highlighting)
            - \`spekter-nw\` — mode terminal

            Dépendances systèmes : fontconfig/freetype/zlib uniquement (pas de GTK/Qt)."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" spekter-*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Spekter ${{ inputs.spekter_version }} (Linux + Windows)" \
              --notes "$notes"
          else
            gh release create "$tag" spekter-*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "Spekter ${{ inputs.spekter_version }} (Linux + Windows)" \
              --notes "$notes"
          fi